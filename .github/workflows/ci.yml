name: Model-Setu CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize production deploy runs so CI tracking maps to one Render deploy.
concurrency:
  group: model-setu-production-deploy
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML model
        run: python ml-service/train.py

      - name: Start deployment tracking
        id: webhook_start
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DEPLOYMENT_WEBHOOK_SECRET: ${{ secrets.DEPLOYMENT_WEBHOOK_SECRET }}
          BACKEND_URL: https://model-setu-backend.onrender.com
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import json
          import hmac
          import hashlib
          import urllib.request

          secret = os.environ["DEPLOYMENT_WEBHOOK_SECRET"]
          payload = json.dumps({
              "event": "start",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "version": "ci-" + os.environ["GITHUB_RUN_NUMBER"],
              "commit_sha": os.environ["GITHUB_SHA"]
          }, separators=(",", ":")).encode()

          signature = "sha256=" + hmac.new(
              secret.encode(), payload, hashlib.sha256
          ).hexdigest()

          req = urllib.request.Request(
              os.environ["BACKEND_URL"] + "/webhook",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "X-Model-Setu-Signature": signature
              },
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              result = json.loads(response.read())

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"deployment_id={result['deployment_id']}\n")

          print("Deployment tracking started:", result["deployment_id"])
          PY

      - name: Run automated tests
        run: python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate backend Docker image
        run: docker build --file backend/Dockerfile --tag model-setu-backend:ci .

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/model-setu-ml" >> "$GITHUB_OUTPUT"

      - name: Build and Publish ML Service Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ml-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Trigger Render Deployment
        id: render_deploy
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          response_file="$RUNNER_TEMP/render-deploy-response.json"

          # Pass the exact image built for this commit to the Render image-backed service.
          deploy_url=$(python - <<'PYTHON'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          hook_url = os.environ["RENDER_DEPLOY_HOOK_URL"]
          image_url = os.environ["IMAGE_URL"]
          parts = urlsplit(hook_url)
          query = parse_qsl(parts.query, keep_blank_values=True)
          query.append(("imgURL", image_url))
          print(urlunsplit((
              parts.scheme,
              parts.netloc,
              parts.path,
              urlencode(query),
              parts.fragment
          )))
          PYTHON
          )

          http_status=$(curl --fail --silent --show-error --request POST "$deploy_url" --output "$response_file" --write-out "%{http_code}")

          if [ "$http_status" != "200" ] && [ "$http_status" != "202" ]; then
            echo "Unexpected Render deploy-hook HTTP status: $http_status"
            exit 1
          fi

          # Render may return either 200 or 202. Parse the response body
          # for the exact deployment ID in both cases when one is provided.
          python - "$response_file" >> "$GITHUB_OUTPUT" <<'PYTHON'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as response_file:
                  response = json.load(response_file)
          except (OSError, json.JSONDecodeError):
              response = {}

          deploy = response.get("deploy", response)
          deploy_id = deploy.get("id") if isinstance(deploy, dict) else None
          if isinstance(deploy_id, str) and deploy_id.strip():
              print("render_deploy_id=" + deploy_id.strip())
              print("::notice::Render deployment ID captured: " + deploy_id.strip(), file=sys.stderr)
          else:
              print("Render hook response did not include a deployment ID; backend will verify by commit and deploy window.")
          PYTHON

      - name: Smoke test live backend and ML APIs
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          BACKEND_URL: https://model-setu-backend.onrender.com
          ML_SERVICE_URL: https://model-setu.onrender.com
        run: |
          python - <<'PYTHON'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          backend = os.environ["BACKEND_URL"].rstrip("/")
          ml_service = os.environ["ML_SERVICE_URL"].rstrip("/")

          def request_json(url, method="GET", body=None, timeout=25):
              data = None if body is None else json.dumps(body).encode()
              headers = {"Accept": "application/json"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{url} returned HTTP {response.status}")
                  return json.loads(response.read().decode())

          def wait_for(label, check, timeout_seconds=600):
              deadline = time.monotonic() + timeout_seconds
              attempt = 0
              last_error = None
              while time.monotonic() < deadline:
                  attempt += 1
                  try:
                      result = check()
                      print(f"{label}: ready on attempt {attempt}: {result}")
                      return result
                  except Exception as exc:
                      last_error = exc
                      print(f"{label}: attempt {attempt} not ready: {exc}")
                      time.sleep(10)
              raise RuntimeError(f"{label} did not become ready: {last_error}")

          wait_for(
              "Backend health",
              lambda: (
                  (lambda data: data if data.get("status") == "healthy" else
                   (_ for _ in ()).throw(RuntimeError(f"unexpected response: {data}")))(
                      request_json(backend + "/health")
                  )
              )
          )

          wait_for(
              "ML model health",
              lambda: (
                  (lambda data: data if data.get("status") == "healthy" and data.get("model_loaded") is True else
                   (_ for _ in ()).throw(RuntimeError(f"model not ready: {data}")))(
                      request_json(ml_service + "/health")
                  )
              )
          )

          model_info = request_json(ml_service + "/model-info")
          required_metadata = ("model_name", "model_version", "classes", "features", "dataset")
          missing = [key for key in required_metadata if key not in model_info]
          if missing:
              raise RuntimeError(f"ML model-info missing fields: {missing}")
          if model_info["model_name"] != "customer-churn-random-forest":
              raise RuntimeError(f"Unexpected model name: {model_info['model_name']}")
          if model_info["model_version"] != "2.0.0":
              raise RuntimeError(f"Unexpected model version: {model_info['model_version']}")
          if model_info["classes"] != ["stay", "churn"]:
              raise RuntimeError(f"Unexpected customer classes: {model_info['classes']}")
          print("Customer churn model metadata passed:", model_info)

          prediction = request_json(
              ml_service + "/predict",
              method="POST",
              body={"features": [12, 85, 3, 1]}
          )
          if prediction.get("prediction") not in ("stay", "churn"):
              raise RuntimeError(f"Unexpected customer churn prediction: {prediction}")
          if not 0 <= float(prediction.get("confidence", -1)) <= 1:
              raise RuntimeError(f"Invalid prediction confidence: {prediction}")
          print("Live ML prediction passed:", prediction)

          def request_text(url, timeout=25):
              req = urllib.request.Request(url, headers={"Accept": "text/plain"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{url} returned HTTP {response.status}")
                  return response.read().decode()

          ml_metrics = request_text(ml_service + "/metrics")
          required_ml_metrics = (
              "model_setu_ml_prediction_requests_total",
              "model_setu_ml_predictions_total",
              "model_setu_ml_prediction_errors_total",
              "model_setu_ml_prediction_duration_seconds",
          )
          missing_metrics = [name for name in required_ml_metrics if name not in ml_metrics]
          if missing_metrics:
              raise RuntimeError(f"ML metrics endpoint missing metrics: {missing_metrics}")
          print("ML Prometheus metrics passed:", required_ml_metrics)

          backend_metrics = request_text(backend + "/metrics")
          if "model_setu_http_requests_total" not in backend_metrics:
              raise RuntimeError("Backend Prometheus HTTP request metric is missing")
          print("Backend Prometheus metrics passed")

          backend_version = request_json(backend + "/version")
          if backend_version.get("project") != "Model-Setu":
              raise RuntimeError(f"Unexpected backend version response: {backend_version}")
          print("Backend version passed:", backend_version)

          deployment_history = request_json(backend + "/deployments")
          if not isinstance(deployment_history.get("deployments"), list):
              raise RuntimeError(f"Invalid deployment history response: {deployment_history}")
          print("Deployment history API passed; records:", deployment_history.get("count"))
          PYTHON

      - name: Smoke test deployed Vercel frontend
        id: frontend_smoke
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          FRONTEND_URL: https://model-setu.vercel.app
        run: |
          python - <<'PYTHON'
          import os
          import time
          import urllib.request
          import urllib.error

          base = os.environ["FRONTEND_URL"].rstrip("/")
          paths = (
              "/",
              "/home.html",
              "/home.css",
              "/home.js",
              "/index.html",
              "/style.css",
              "/script.js",
              "/demo.html",
          )

          def fetch(path):
              url = base + path
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Model-Setu-frontend-smoke/1.0"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  if response.status != 200 or not body:
                      raise RuntimeError(
                          f"{url} returned HTTP {response.status} or an empty body"
                      )
                  return response.geturl(), response.headers.get("Content-Type", ""), body

          failures = []
          for path in paths:
              last_error = None
              for attempt in range(1, 4):
                  try:
                      final_url, content_type, body = fetch(path)
                      print(
                          f"PASS {path}: {len(body)} bytes, "
                          f"{content_type}, final URL {final_url}"
                      )
                      break
                  except Exception as exc:
                      last_error = exc
                      print(f"Attempt {attempt}/3 failed for {path}: {exc}")
                      time.sleep(5)
              else:
                  failures.append(f"{path}: {last_error}")

          if failures:
              print("Vercel frontend smoke test found unavailable routes/assets:")
              for failure in failures:
                  print(" -", failure)
              raise SystemExit(1)

          print("Vercel frontend pages and static assets are reachable.")
          PYTHON

      - name: Notify backend
        if: always() && steps.webhook_start.outputs.deployment_id != ''
        env:
          DEPLOYMENT_WEBHOOK_SECRET: ${{ secrets.DEPLOYMENT_WEBHOOK_SECRET }}
          BACKEND_URL: https://model-setu-backend.onrender.com
          GITHUB_RUN_ID: ${{ github.run_id }}
          DEPLOYMENT_ID: ${{ steps.webhook_start.outputs.deployment_id }}
          RENDER_DEPLOY_ID: ${{ steps.render_deploy.outputs.render_deploy_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PYTHON'
          import os, json, hmac, hashlib, time, socket
          import urllib.request, urllib.error

          secret = os.environ["DEPLOYMENT_WEBHOOK_SECRET"]
          url = os.environ["BACKEND_URL"].rstrip("/") + "/webhook"
          succeeded = os.environ["JOB_STATUS"] == "success"

          payload_data = {
              "event": "completed",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "deployment_id": int(os.environ["DEPLOYMENT_ID"]),
              "status": "success" if succeeded else "failed",
          }
          rid = os.environ.get("RENDER_DEPLOY_ID", "").strip()
          if rid:
              payload_data["render_deploy_id"] = rid

          payload = json.dumps(payload_data, separators=(",", ":")).encode()
          sig = "sha256=" + hmac.new(secret.encode(), payload, hashlib.sha256).hexdigest()
          headers = {
              "Content-Type": "application/json",
              "X-Model-Setu-Signature": sig,
              "User-Agent": "model-setu-ci/1.0",
          }

          RETRYABLE = {202, 502, 503, 504}
          deadline = time.monotonic() + (900 if succeeded else 60)
          attempt = 0

          while True:
              attempt += 1
              status, result = None, {}
              req = urllib.request.Request(url, data=payload, headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      status = r.status
                      result = json.loads(r.read())
              except urllib.error.HTTPError as e:
                  status = e.code
                  try:
                      result = json.loads(e.read())
                  except Exception:
                      result = {"error": str(e)}
              except (urllib.error.URLError, TimeoutError, socket.timeout, ConnectionError) as e:
                  result = {"error": repr(e)}

              print(f"Attempt {attempt}: HTTP {status}: {result}")

              if status == 200 and result.get("status") in ("success", "failed"):
                  print("Done:", result)
                  break

              retryable = (status is None or status in RETRYABLE
                           or (status == 200 and result.get("status") == "pending"))
              if not retryable:
                  raise RuntimeError(f"Webhook HTTP {status}: {result}")

              if time.monotonic() + 20 > deadline:
                  msg = "Webhook did not reach a final state before deadline."
                  if succeeded:
                      raise RuntimeError(msg)
                  print("WARNING:", msg)
                  break
              time.sleep(20)
          PYTHON
      - name: Enforce frontend smoke-test result
        if: always() && steps.frontend_smoke.outcome == 'failure'
        run: |
          echo "The deployed Vercel frontend smoke test failed."
          exit 1
