name: Model-Setu CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize production deploy runs so CI tracking maps to one Render deploy.
concurrency:
  group: model-setu-production-deploy
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start deployment tracking
        id: webhook_start
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          DEPLOYMENT_WEBHOOK_SECRET: ${{ secrets.DEPLOYMENT_WEBHOOK_SECRET }}
          BACKEND_URL: https://model-setu-backend.onrender.com
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import json
          import hmac
          import hashlib
          import urllib.request

          secret = os.environ["DEPLOYMENT_WEBHOOK_SECRET"]
          payload = json.dumps({
              "event": "start",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "version": "ci-" + os.environ["GITHUB_RUN_NUMBER"],
              "commit_sha": os.environ["GITHUB_SHA"]
          }, separators=(",", ":")).encode()

          signature = "sha256=" + hmac.new(
              secret.encode(), payload, hashlib.sha256
          ).hexdigest()

          req = urllib.request.Request(
              os.environ["BACKEND_URL"] + "/webhook",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "X-Model-Setu-Signature": signature
              },
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              result = json.loads(response.read())

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"deployment_id={result['deployment_id']}\n")

          print("Deployment tracking started:", result["deployment_id"])
          PY

      - name: Run automated tests
        run: python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate backend Docker image
        run: docker build --file backend/Dockerfile --tag model-setu-backend:ci .

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/model-setu-ml" >> "$GITHUB_OUTPUT"

      - name: Build and Publish ML Service Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ml-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Trigger Render Deployment
        id: render_deploy
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          response_file="$RUNNER_TEMP/render-deploy-response.json"

          # Pass the exact image built for this commit to the Render image-backed service.
          deploy_url=$(python - <<'PYTHON'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          hook_url = os.environ["RENDER_DEPLOY_HOOK_URL"]
          image_url = os.environ["IMAGE_URL"]
          parts = urlsplit(hook_url)
          query = parse_qsl(parts.query, keep_blank_values=True)
          query.append(("imgURL", image_url))
          print(urlunsplit((
              parts.scheme,
              parts.netloc,
              parts.path,
              urlencode(query),
              parts.fragment
          )))
          PYTHON
          )

          http_status=$(curl --fail --silent --show-error --request POST "$deploy_url" --output "$response_file" --write-out "%{http_code}")

          if [ "$http_status" != "200" ] && [ "$http_status" != "202" ]; then
            echo "Unexpected Render deploy-hook HTTP status: $http_status"
            exit 1
          fi

          # Render may return either 200 or 202. Parse the response body
          # for the exact deployment ID in both cases when one is provided.
          python - "$response_file" >> "$GITHUB_OUTPUT" <<'PYTHON'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as response_file:
                  response = json.load(response_file)
          except (OSError, json.JSONDecodeError):
              response = {}

          deploy = response.get("deploy", response)
          deploy_id = deploy.get("id") if isinstance(deploy, dict) else None
          if isinstance(deploy_id, str) and deploy_id.strip():
              print("render_deploy_id=" + deploy_id.strip())
              print("Render deployment ID captured:", deploy_id.strip())
          else:
              print("Render hook response did not include a deployment ID; backend will verify by commit and deploy window.")
          PYTHON

      - name: Complete deployment tracking
        if: always() && steps.webhook_start.outputs.deployment_id != ''
        env:
          DEPLOYMENT_WEBHOOK_SECRET: ${{ secrets.DEPLOYMENT_WEBHOOK_SECRET }}
          BACKEND_URL: https://model-setu-backend.onrender.com
          GITHUB_RUN_ID: ${{ github.run_id }}
          DEPLOYMENT_ID: ${{ steps.webhook_start.outputs.deployment_id }}
          RENDER_DEPLOY_ID: ${{ steps.render_deploy.outputs.render_deploy_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PYTHON'
          import os, json, hmac, hashlib, time
          import urllib.request
          import urllib.error

          secret = os.environ["DEPLOYMENT_WEBHOOK_SECRET"]
          url = os.environ["BACKEND_URL"] + "/webhook"
          job_status = os.environ["JOB_STATUS"]

          payload_data = {
              "event": "completed",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "deployment_id": int(os.environ["DEPLOYMENT_ID"]),
              "status": "success" if job_status == "success" else "failed"
          }

          render_deploy_id = os.environ.get("RENDER_DEPLOY_ID", "").strip()
          if render_deploy_id:
              payload_data["render_deploy_id"] = render_deploy_id

          payload = json.dumps(payload_data, separators=(",", ":")).encode()

          signature = "sha256=" + hmac.new(
              secret.encode(), payload, hashlib.sha256
          ).hexdigest()

          headers = {
              "Content-Type": "application/json",
              "X-Model-Setu-Signature": signature
          }

          max_attempts = 30 if job_status == "success" else 1

          for attempt in range(1, max_attempts + 1):
              req = urllib.request.Request(
                  url, data=payload, headers=headers, method="POST"
              )

              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      http_status = response.status
                      result = json.loads(response.read())
              except urllib.error.HTTPError as error:
                  http_status = error.code
                  try:
                      result = json.loads(error.read())
                  except Exception:
                      result = {"error": str(error)}

                  if http_status != 502:
                      raise RuntimeError(
                          "Webhook HTTP {}: {}".format(http_status, result)
                      )

              print("Attempt {}/{}: {}".format(attempt, max_attempts, result))

              if http_status == 200 and result.get("status") in ("success", "failed"):
                  print("Deployment tracking completed:", result)
                  break

              if http_status not in (202, 502):
                  raise RuntimeError("Unexpected webhook response: {}".format(result))

              if attempt == max_attempts:
                  raise RuntimeError(
                      "Render did not become live within 10 minutes. "
                      "Deployment remains pending for investigation."
                  )

              time.sleep(20)
          PYTHON
